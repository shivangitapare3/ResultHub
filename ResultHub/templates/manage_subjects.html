<!DOCTYPE html>
<html>
<head>
    <title>Manage Subjects</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">📊 Student Result System</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/logout" class="logout-btn" onclick="return confirm('Are you sure you want to logout?')">Logout</a>
    </div>
</div>

<div class="subject-wrapper">

    <div class="subject-card">
        <h2>📊 Upgrade Subjects (Semester Wise)</h2>

        <form method="POST">

            <div class="subject-grid">
                <div class="column">
                    {% for i in range(1,6) %}
                        <input type="text" name="subject{{i}}" placeholder="Subject {{i}}">
                    {% endfor %}
                </div>

                <div class="column">
                    {% for i in range(6,11) %}
                        <input type="text" name="subject{{i}}" placeholder="Subject {{i}}">
                    {% endfor %}
                </div>
            </div>

            <button type="submit">Save Subjects</button>
        </form>

        <hr>

        <h3>📌 Current Subjects:</h3>

        {% if data %}
            <ul>
                {% for s in data %}
                    <li>{{ s[0] }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No subjects added yet</p>
        {% endif %}

    </div>

</div>

</body>
</html>
