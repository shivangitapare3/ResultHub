<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head>

<body class="dashboard">
    <div class="navbar">
    <div class="logo">📊 Student Result System</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/logout" class="logout-btn" onclick="return confirm('Are you sure you want to logout?')">Logout</a>
    </div>
</div>

<h1 style="text-align:center;">📊 Bar Chart</h1>

<div class="chart-box">
    <canvas id="chart"></canvas>
</div>

<div style="text-align:center;">
    <a href="/student_analytics">⬅ Back</a>
</div>

<script>

let data = {{ marks|tojson }};
let labels = {{ subjects|tojson }};

console.log("Marks:", data);
console.log("Subjects:", labels);

new Chart(document.getElementById("chart"), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: "Marks",
            data: data,
            backgroundColor: "rgba(0, 198, 255, 0.7)",
            borderColor: "#00c6ff",
            borderWidth: 2

            }]
        },
        options: {
        responsive: true,
        maintainAspectRatio: false
    }
});
</script>

</body>
</html>
