<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="navbar">
    <div class="logo">📊 Student Result System</div>
    

    <div class="nav-links">
        <a href="/dashboard" >Dashboard</a>
        <a href="/logout" class="logout-btn"onclick="return confirm('Are you sure you want to logout?')">Logout</a>
    </div>
</div>


<div class="container">
<div class="card">

<h2>Add Student</h2>

<form method="POST">
<input name="name" placeholder="Name">
<input name="student_id" placeholder="Student ID">
<input type="text" name="phone" maxlength="10" pattern="[0-9]{10}" placeholder="Phone Number" required >
<input type="text" name="class" value="SYBSC(CS)" required>
<input type="email" name="email" placeholder="Email" required>
<button>Add</button>
</form>
{% if msg %}
<p style="color:lightgreen; margin-top:15px;">{{ msg }}</p>
{% endif %}
</div>
</div>
</body>
</html>
